version: 0.2

env:
  variables:
    IMAGE_NAME: "test-image"
    IMAGE_TAG: "${IMAGE_TAG:-latest}"
    TEST_PORT: "3000"
    TEST_PATH: "/"
    CURL_MAX_RETRIES: "20"   # 20 * 5s = up to ~100s

phases:
  pre_build:
    commands:
      - "echo Starting test build on $(date)"
      - "docker --version"
  build:
    commands:
      - "echo Building local Docker image..."
      - "docker build -t ${IMAGE_NAME}:${IMAGE_TAG} ."
  post_build:
    commands:
      - "echo Running container on port ${TEST_PORT}..."
      - "docker run -d --rm -e PORT=${TEST_PORT} -e HOST=0.0.0.0 -p ${TEST_PORT}:${TEST_PORT} --name app-under-test ${IMAGE_NAME}:${IMAGE_TAG}"
      - "sleep 3"
      - "docker ps"
      - "echo Performing HTTP smoke test..."
      - "bash -c 's=1; for i in $(seq 1 ${CURL_MAX_RETRIES}); do if curl -fsS \"http://127.0.0.1:${TEST_PORT}${TEST_PATH}\" >/dev/null; then s=0; break; fi; echo \"Waiting for app... ($i/${CURL_MAX_RETRIES})\"; sleep 5; done; if [ \"$s\" -ne 0 ]; then echo \"Smoke test failed\"; docker ps -a; docker logs app-under-test || true; exit 1; fi'"
      - "echo Stopping container..."
      - "docker stop app-under-test || true"

artifacts:
  files:
    - "**/*"
  discard-paths: yes
