version: 0.2

env:
  variables:
    IMAGE_NAME: "test-image"
    IMAGE_TAG: "${IMAGE_TAG:-latest}"
    TEST_URL: "http://localhost:3000"
    TEST_COMMAND: "curl -f -s ${TEST_URL} || exit 1"

phases:
  pre_build:
    commands:
      - echo "Starting test build on $(date)"
      - docker --version
      - aws --version
  build:
    commands:
      - echo "Building local Docker image..."
      - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} .
  post_build:
    commands:
      - echo "Running container for smoke test..."
      - docker run -d --rm -p 3000:3000 --name app-under-test ${IMAGE_NAME}:${IMAGE_TAG}
      - echo "Waiting for app to be ready..."
      - sleep 5
      - echo "Executing test command..."
      - bash -c "${TEST_COMMAND}"
      - echo "✅ Tests passed successfully!"
      - echo "Stopping container..."
      - docker stop app-under-test || true

artifacts:
  files:
    - "**/*"
  discard-paths: yes
